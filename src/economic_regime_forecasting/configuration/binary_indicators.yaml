# The ten binary indicators this project forecasts, at one, five and ten years.
#
# Every indicator is phrased as a condition on the state of the economy in a
# single month: a series above a threshold, or below one. That restriction is
# deliberate and it is what makes the whole method coherent. A condition of that
# shape has a probability given the regime, so it composes through the transition
# matrix exactly, at any horizon, without a further assumption.
#
# Questions phrased relative to today's level -- "will unemployment rise two
# points from where it is now" -- are deliberately absent. They are perfectly good
# forecasting questions, but their probability depends on today's level as well as
# on the regime, which needs a conditional distribution of the level given the
# regime rather than an event probability. That is a different and larger model.
# The exclusion is a scope decision, recorded here and in the report, not an
# oversight.
#
# composition says how a monthly condition becomes a horizon forecast:
#
#   point_in_time            asks whether the condition holds in the single month
#                            of the horizon date. The forecast is the projected
#                            regime distribution dotted with the per-regime rate.
#
#   any_time_within_horizon  asks whether the condition holds in any month between
#                            now and the horizon. The forecast integrates over the
#                            whole regime path, tracking the probability that the
#                            condition has still not occurred. Treating one of
#                            these as point-in-time understates its probability
#                            badly and systematically.
#
# The set is balanced five and five so both paths carry real weight in the
# evaluation.

schema_version: 1

indicators:

  - name: economy_in_recession_within_horizon
    question: >-
      Is the United States economy in a recession dated by the National Bureau of
      Economic Research at any point between now and the horizon?
    resolution:
      series: recession_indicator
      rule: level_above_threshold_within_horizon
      threshold: 0.5
    composition: any_time_within_horizon
    horizons_in_years: [1, 5, 10]

  - name: economy_in_recession_at_horizon_date
    question: >-
      Is the United States economy in a recession dated by the National Bureau of
      Economic Research in the single month of the horizon date?
    resolution:
      series: recession_indicator
      rule: level_above_threshold_at_horizon
      threshold: 0.5
    composition: point_in_time
    horizons_in_years: [1, 5, 10]

  - name: unemployment_rate_above_five_percent_at_horizon
    question: Is the unemployment rate above five percent in the horizon month?
    resolution:
      series: unemployment_rate
      rule: level_above_threshold_at_horizon
      threshold: 5.0
    composition: point_in_time
    horizons_in_years: [1, 5, 10]

  - name: unemployment_rate_above_seven_percent_within_horizon
    question: >-
      Does the unemployment rate exceed seven percent at any point between now and
      the horizon?
    resolution:
      series: unemployment_rate
      rule: level_above_threshold_within_horizon
      threshold: 7.0
    composition: any_time_within_horizon
    horizons_in_years: [1, 5, 10]

  - name: consumer_price_inflation_above_three_percent_at_horizon
    question: >-
      Is year-over-year consumer price inflation above three percent in the
      horizon month?
    resolution:
      series: consumer_price_index
      transform: year_over_year_percent_change
      rule: level_above_threshold_at_horizon
      threshold: 3.0
    composition: point_in_time
    horizons_in_years: [1, 5, 10]

  - name: consumer_price_inflation_above_five_percent_within_horizon
    question: >-
      Does year-over-year consumer price inflation exceed five percent at any
      point between now and the horizon?
    resolution:
      series: consumer_price_index
      transform: year_over_year_percent_change
      rule: level_above_threshold_within_horizon
      threshold: 5.0
    composition: any_time_within_horizon
    horizons_in_years: [1, 5, 10]

  - name: federal_funds_rate_above_four_percent_at_horizon
    question: Is the effective federal funds rate above four percent in the horizon month?
    resolution:
      series: federal_funds_rate
      rule: level_above_threshold_at_horizon
      threshold: 4.0
    composition: point_in_time
    horizons_in_years: [1, 5, 10]

  - name: federal_funds_rate_below_one_percent_within_horizon
    question: >-
      Does the effective federal funds rate fall below one percent at any point
      between now and the horizon?
    resolution:
      series: federal_funds_rate
      rule: level_below_threshold_within_horizon
      threshold: 1.0
    composition: any_time_within_horizon
    horizons_in_years: [1, 5, 10]

  - name: treasury_yield_curve_inverted_within_horizon
    question: >-
      Does the ten-year Treasury yield fall below the three-month bill rate, an
      inverted yield curve, at any point between now and the horizon?
    resolution:
      series: ten_year_minus_three_month_term_spread
      rule: level_below_threshold_within_horizon
      threshold: 0.0
    composition: any_time_within_horizon
    horizons_in_years: [1, 5, 10]

  - name: industrial_production_growth_above_two_percent_at_horizon
    question: >-
      Is industrial production growing more than two percent year over year in the
      horizon month?
    resolution:
      series: industrial_production
      transform: year_over_year_percent_change
      rule: level_above_threshold_at_horizon
      threshold: 2.0
    composition: point_in_time
    horizons_in_years: [1, 5, 10]
