# Lint, types, the layer check and the offline test suite, on every push and pull request.
# The suite needs no fetched data: tests that reach the Federal Reserve are marked
# `network` and deselected, and the cache points at an empty directory.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's answer irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned rather than ubuntu-latest, so an image change cannot move the environment
    # under the suite unannounced (ubuntu-latest becomes Ubuntu 26 on 2026-10-19).
    runs-on: ubuntu-24.04
    # The suite takes about twenty minutes on a hosted runner; anything far longer is a hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # mypy targets 3.11 (pyproject.toml), and numpy's stubs for newer Pythons
          # use syntax 3.11 cannot parse, so the suite runs on the version it is typed for.
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry==2.4.3
      - name: Install the environment
        run: poetry install --no-interaction
      - name: Lint, format, types and layers
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy
          python3 scripts/layer_check.py
      - name: Test suite
        env:
          ECONOMIC_REGIME_FORECASTING_CACHE: ${{ runner.temp }}/cache
        run: poetry run pytest -m "not network"
