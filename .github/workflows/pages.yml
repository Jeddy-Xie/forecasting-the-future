# Publishes the project page, site/, with the paper beside it, to GitHub Pages.
# Nothing is computed here: site/data.json and the images are generated by
# `forecast page-assets` and committed, and the tests check they match the record.
name: Project page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "paper/main.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the page and the paper
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp paper/main.pdf _site/paper.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
